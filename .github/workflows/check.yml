name: Validate MindBoard

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run test:native
      - id: build
        run: npm run desktop:build -- --no-bundle
      - name: Prepare Windows WebDriver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/.tools | Out-Null
          function Get-WebViewRuntime {
            $roots = @("${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application")
            $roots | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -Directory } | Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          }
          $runtime = Get-WebViewRuntime
          if (-not $runtime) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile src-tauri/.tools/WebView2Setup.exe
            $install = Start-Process -FilePath src-tauri/.tools/WebView2Setup.exe -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 installation failed: $($install.ExitCode)" }
            $runtime = Get-WebViewRuntime
          }
          if (-not $runtime) { throw 'The WebView2 runtime is required for native tests.' }
          $webviewVersion = $runtime.Name
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$($runtime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using WebView2 $webviewVersion from $($runtime.FullName)"
          New-Item -ItemType Directory -Force src-tauri/.tools/edge | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$webviewVersion/edgedriver_win64.zip" -OutFile src-tauri/.tools/edge.zip
          Expand-Archive -LiteralPath src-tauri/.tools/edge.zip -DestinationPath src-tauri/.tools/edge -Force
      - id: desktop
        run: npm run test:desktop
        env:
          DESKTOP_DRIVER: edge
          DESKTOP_ELEVATED_POLICY: '1'
      - name: Collect Windows startup diagnostics
        if: failure() && steps.desktop.outcome == 'failure'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'mind-board|msedgewebview2|WebView2' } |
            Select-Object TimeCreated, Id, ProviderName, Message |
            Format-List | Out-File test-results/windows-startup.log
          Get-Process mind-board,msedgewebview2 -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path | Format-List |
            Out-File test-results/windows-processes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-reports
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: MindBoard-Windows
          path: |
            src-tauri/target/release/mind-board.exe
            LICENSE
            THIRD_PARTY_NOTICES.txt
